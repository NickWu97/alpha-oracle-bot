name: Alpha Oracle Pro v10.0.0

on:
  schedule:
    # 🔍 掃描模式 (產生新訊號) - 每 15 分鐘，僅交易時段
    - cron: "*/15 1-5 * * *"     # 亞洲盤 09:00-13:00 TW
    - cron: "*/15 13-17 * * *"   # 歐美盤 21:00-01:00 TW
    
    # 🔁 監控模式 (檢查 TP/SL) - 每 2 分鐘，24 小時
    - cron: "*/2 * * * *"
    
    # 📊 戰報 - 台灣時間 00:05 (UTC 16:05)
    - cron: "5 16 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "執行模式"
        required: false
        default: "scan"
        type: choice
        options: [scan, monitor, daily_report]

permissions:
  contents: write

concurrency:
  group: alpha-oracle-pro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  alpha-oracle-pro:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: 🎯 Determine Mode
        id: mode
        run: |
          # 手動觸發優先
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          MIN_INT=$((10#$MIN))
          
          # 戰報: UTC 16:05 (TW 00:05)
          if [ "$HOUR" = "16" ] && [ "$MIN_INT" -ge 5 ] && [ "$MIN_INT" -lt 10 ]; then
            echo "mode=daily_report" >> $GITHUB_OUTPUT
          # 每 15 分鐘的 00/15/30/45 → scan (僅交易時段)
          elif [[ "$MIN" =~ ^(00|15|30|45)$ ]]; then
            if { [ "$HOUR" -ge 1 ] && [ "$HOUR" -le 5 ]; } || { [ "$HOUR" -ge 13 ] && [ "$HOUR" -le 17 ]; }; then
              echo "mode=scan" >> $GITHUB_OUTPUT
            else
              echo "mode=monitor" >> $GITHUB_OUTPUT
            fi
          # 其他時間 → monitor
          else
            echo "mode=monitor" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Run Alpha Oracle Pro
        env:
          TG_TOKEN:             ${{ secrets.TG_TOKEN }}
          CHAT_ID:              ${{ secrets.CHAT_ID }}
          SETUP_SCORE:          "68"
          MAX_SIGNALS:          "12"
          MAX_CONCURRENT:       "20"
          MONITOR_INTERVAL:     "60"          # GitHub Actions 最小 1 分鐘
          CONFIRM_TP_ON_CLOSE:  "true"        # TP1/TP2 需收盤確認
          ENTRY_TOLERANCE:      "0.002"
        run: |
          echo "🎯 執行模式: ${{ steps.mode.outputs.mode }}"
          python main.py --mode ${{ steps.mode.outputs.mode }} --interval 60

      - name: 💾 Commit State
        if: always()
        run: |
          git config user.name "alpha-oracle-pro[bot]"
          git config user.email "bot@alpha-oracle.dev"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          
          # 安全 pull
          git pull --rebase --autostash origin main || true
          
          # 提交狀態檔案
          git add -f active_signals.json trade_history.json daily_stats.csv alpha_oracle.log 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "🤖 bot: state update [${{ steps.mode.outputs.mode }}] [skip ci]"
            git pull --rebase --autostash origin main || true
            git push || git push --force-with-lease
            echo "✅ 狀態已同步"
          else
            echo "ℹ️  無狀態變更"
          fi
        continue-on-error: true
