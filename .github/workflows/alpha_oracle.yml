name: Alpha Oracle Pro

on:
  schedule:
    - cron: "*/15 * * * *"
  
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha-oracle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    name: 🤖 Alpha Oracle Pro v13.0
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # 🔹 移除 cache: 'pip' 以避免找不到 requirements.txt 的錯誤

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests websockets pandas numpy --quiet
          echo "✅ 依賴套件安裝完成"

      - name: 🗄️ Initialize Files
        run: |
          [ -f active_signals.json ] || echo '{}' > active_signals.json
          [ -f trade_history.json ] || echo '[]' > trade_history.json
          [ -f alpha_oracle.db ] || touch alpha_oracle.db
          touch alpha_oracle.log
          echo "✅ 檔案初始化完成"

      - name: 🔍 Environment Check
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          echo "═══════════════════════════════════"
          echo "🔍 環境變數檢查"
          echo "═══════════════════════════════════"
          
          if [ -z "$TG_TOKEN" ]; then
            echo "❌ TG_TOKEN 未設定！"
            exit 1
          else
            echo "✅ TG_TOKEN: 已設定 (${#TG_TOKEN} 字元)"
          fi
          
          if [ -z "$CHAT_ID" ]; then
            echo "❌ CHAT_ID 未設定！"
            exit 1
          else
            echo "✅ CHAT_ID: ${CHAT_ID:0:10}..."
          fi
          
          echo ""
          echo "📤 測試 Telegram 連接..."
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=🧪 Alpha Oracle Pro v13.0 測試" \
            -d "parse_mode=Markdown")
          
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "✅ Telegram 連接成功"
          else
            echo "❌ Telegram 連接失敗: $RESPONSE"
            exit 1
          fi
          
          echo "═══════════════════════════════════"

      - name: 🚀 Run Alpha Oracle Pro v13.0
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          USE_WEBSOCKET: "true"
          CANDLE_CLOSE_MODE: "false"
          DAILY_SL_LIMIT: "2"
          MULTI_TF_CONFIRMATION: "true"
          VOLUME_CONFIRMATION: "true"
          CORRELATION_FILTER: "true"
          REPORT_TIME: "22:00"
          MAX_SIGNALS: "3"
          SETUP_SCORE_THRESHOLD: "68"
          TZ: Asia/Taipei
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "."
        run: |
          echo "🚀 Alpha Oracle Pro v13.0 專業簡報版啟動"
          echo "═══════════════════════════════════"
          echo "✨ 功能配置："
          echo "  🔌 WebSocket: $USE_WEBSOCKET"
          echo "  🕯️ Candle-close: $CANDLE_CLOSE_MODE"
          echo "  📊 多時框確認: $MULTI_TF_CONFIRMATION"
          echo "  📈 成交量確認: $VOLUME_CONFIRMATION"
          echo "  🔒 相關性過濾: $CORRELATION_FILTER"
          echo "  📊 每日 SL 限額: $DAILY_SL_LIMIT"
          echo "  ⏰ 報告時間: $REPORT_TIME"
          echo "═══════════════════════════════════"
          
          python main.py
          
          EXIT_CODE=$?
          
          echo "═══════════════════════════════════"
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ 執行成功"
          else
            echo "❌ 執行失敗 (退出碼: $EXIT_CODE)"
          fi
          echo "═══════════════════════════════════"
          
          exit $EXIT_CODE

      - name: 📋 Show Logs
        if: always()
        run: |
          echo "📝 應用程式日誌 (最後 30 行)："
          echo "─────────────────────────────"
          tail -30 alpha_oracle.log 2>/dev/null || echo "❌ 無日誌檔案"
          echo "─────────────────────────────"

      - name: 💾 Save State Files
        if: always()
        run: |
          git config user.name "alpha-bot"
          git config user.email "bot@alpha-oracle.pro"
          git add -f active_signals.json trade_history.json alpha_oracle.db alpha_oracle.log 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "🤖 auto: sync state $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main --quiet || true
            git push origin main --quiet || git push --force-with-lease origin main --quiet
            echo "✅ 狀態檔案已保存"
          else
            echo "ℹ️  無變更，跳過保存"
          fi
        continue-on-error: true

      - name: 📦 Upload Debug Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-${{ github.run_id }}
          path: |
            alpha_oracle.log
            active_signals.json
            trade_history.json
            alpha_oracle.db
          retention-days: 3
          compression-level: 6
