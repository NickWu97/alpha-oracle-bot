name: Alpha Oracle Pro

on:
  schedule:
    # 🕒 Monitor every 5 minutes
    - cron: "*/5 * * * *"
  
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: false
        default: 'monitor'
        type: choice
        options: [monitor, scan, command]
      command:
        description: 'Command (e.g., /stats)'
        required: false
        default: ''

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🗄️ Initialize State Files
        run: |
          # Ensure files exist to prevent JSON errors
          [ -f active_signals.json ] || echo '{}' > active_signals.json
          [ -f trade_history.json ] || echo '[]' > trade_history.json
          echo "✅ State files initialized"

      - name: 🚀 Run Alpha Oracle Bot
        env:
          # 🔐 Secrets (Must be set in GitHub Settings -> Secrets)
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          
          # ⚙️ Runtime Config
          MODE: ${{ github.event.inputs.mode || 'monitor' }}
          COMMAND: ${{ github.event.inputs.command || '' }}
          
        run: |
          echo "🚀 Mode: $MODE"
          if [ -n "$COMMAND" ]; then
            echo "📝 Command: $COMMAND"
          fi
          python main.py

      - name: 💾 Commit State Changes
        if: always()
        run: |
          git config user.name "alpha-bot"
          git config user.email "bot@alpha-oracle.com"
          
          # Add state files
          git add -f active_signals.json trade_history.json 2>/dev/null || true
          
          # Only commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "chore: update state [skip ci]"
            git push
            echo "✅ State saved to repository"
          else
            echo "ℹ️ No state changes to save"
          fi
        continue-on-error: true
