name: Alpha Oracle Pro

on:
  schedule:
    # 🕒 每15分钟执行一次
    - cron: "*/15 * * * *"
  
  workflow_dispatch:
    inputs:
      action:
        description: '快速操作'
        required: false
        default: ''
        type: choice
        options: ['', 'stats']

permissions:
  contents: write

concurrency:
  group: alpha-oracle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    name: 🤖 Alpha Oracle Pro
    runs-on: ubuntu-latest
    timeout-minutes: 2  # ⚡ 严格超时2分钟
    
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: pip install requests pandas numpy --quiet

      - name: 🗄️ Init State Files
        run: |
          [ -f active_signals.json ] || echo '{}' > active_signals.json
          [ -f trade_history.json ] || echo '[]' > trade_history.json
          touch alpha_oracle.log

      - name: 🚀 Run Alpha Oracle Pro
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MAX_SIGNALS: "3"
          SETUP_SCORE_THRESHOLD: "68"
          TZ: Asia/Taipei
        run: |
          echo "🚀 Alpha Oracle Pro - 极速版"
          python main.py ${{ github.event.inputs.action }}

      - name: 💾 Sync State
        if: always()
        run: |
          git config user.name "alpha-bot"
          git config user.email "bot@alpha.com"
          git add -f active_signals.json trade_history.json 2>/dev/null || true
          git diff --staged --quiet || {
            git commit -m "chore: update state [skip ci]"
            git push --quiet
          }
        continue-on-error: true
