name: Alpha Oracle Fusion Bot

on:
  workflow_dispatch:
    inputs:
      send_report:
        description: '是否立即發送當前勝率戰報？'
        required: false
        default: 'false'
        type: boolean
  schedule:
    - cron: '*/15 * * * *'

jobs:
  trade-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run Alpha Oracle Bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MANUAL_REPORT: ${{ github.event.inputs.send_report || 'false' }}
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add active_trades.csv daily_stats.csv midnight.ok || true
          git commit -m "Update trade logs and stats" || echo "No changes to commit"
          git push
