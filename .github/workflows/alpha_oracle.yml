name: Alpha Oracle Pro

on:
  # 🕒 每 15 分钟自动执行（包含扫描 + 检查报告）
  schedule:
    - cron: "*/15 * * * *"
  
  # 🔧 手动触发（一键执行所有功能）
  workflow_dispatch:

# 🔒 权限设定
permissions:
  contents: write

# ⚡ 并发控制
concurrency:
  group: alpha-oracle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    name: 🤖 Alpha Oracle Pro
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # ─────────────────────────────────────
      # 📦 1. 下载程式码
      # ─────────────────────────────────────
      - name: 📦 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ─────────────────────────────────────
      # 🐍 2. Python 环境
      # ─────────────────────────────────────
      - name: 🐍 Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ─────────────────────────────────────
      # 📦 3. 安装依赖
      # ─────────────────────────────────────
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests websockets pandas numpy --quiet
          echo "✅ 依赖安装完成"

      # ─────────────────────────────────────
      # 🗄️ 4. 初始化档案
      # ─────────────────────────────────────
      - name: 🗄️ Init Files
        run: |
          [ -f active_signals.json ] || echo '{}' > active_signals.json
          [ -f trade_history.json ] || echo '[]' > trade_history.json
          touch alpha_oracle.log
          echo "✅ 档案初始化完成"

      # ─────────────────────────────────────
      # 🔍 5. 环境检查
      # ─────────────────────────────────────
      - name: 🔍 Environment Check
        run: |
          echo "📋 环境变数检查："
          echo "  TG_TOKEN: ${#TG_TOKEN} 字元"
          echo "  CHAT_ID: ${CHAT_ID:0:10}..."
          echo "  时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "  时区: ${TZ}"

      # ─────────────────────────────────────
      # 🚀 6. 执行 Alpha Oracle（一键整合所有功能）
      # ─────────────────────────────────────
      - name: 🚀 Run Alpha Oracle Pro (All-in-One)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          
          # 🔹 专业版配置
          USE_WEBSOCKET: "true"
          CANDLE_CLOSE_MODE: "true"
          DAILY_SL_LIMIT: "2"
          MULTI_TF_CONFIRMATION: "true"
          VOLUME_CONFIRMATION: "true"
          CORRELATION_FILTER: "true"
          REPORT_TIME: "22:00"
          
          # 🔹 交易配置
          MAX_SIGNALS: "3"
          SETUP_SCORE_THRESHOLD: "68"
          TZ: Asia/Taipei
          PYTHONUNBUFFERED: "1"
        
        run: |
          echo "🚀 Alpha Oracle Pro v13.0 一键整合版启动"
          echo "══════════════════════════════════════"
          echo "✨ 自动执行以下功能："
          echo "  1️⃣ 市场扫描"
          echo "  2️⃣ 检查每日报告（22:00 自动发送）"
          echo "  3️⃣ 检查月度报告（每月 1 号 22:00）"
          echo "══════════════════════════════════════"
          
          # 🔹 一键执行所有功能
          python main.py
          
          echo "══════════════════════════════════════"
          echo "✅ 所有功能执行完成"

      # ─────────────────────────────────────
      # 📋 7. 显示日志
      # ─────────────────────────────────────
      - name: 📋 Show Logs
        if: always()
        run: |
          echo "📝 最后 30 行日志："
          echo "────────────────────"
          tail -30 alpha_oracle.log || echo "❌ 无日志档案"

      # ─────────────────────────────────────
      # 💾 8. 保存状态
      # ─────────────────────────────────────
      - name: 💾 Save State
        if: always()
        run: |
          git config user.name "alpha-bot"
          git config user.email "bot@alpha-oracle.pro"
          
          # 🔹 添加状态档案
          git add -f active_signals.json trade_history.json alpha_oracle.log 2>/dev/null || true
          
          # 🔹 如果有变更则提交
          if ! git diff --staged --quiet; then
            git commit -m "🤖 auto: update state $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main --quiet || true
            git push origin main --quiet || git push --force-with-lease origin main --quiet
            echo "✅ 状态已保存"
          else
            echo "ℹ️  无变更，跳过保存"
          fi
        continue-on-error: true

      # ─────────────────────────────────────
      # 📦 9. 上传日志（失败时）
      # ─────────────────────────────────────
      - name: 📦 Upload Logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-${{ github.run_id }}
          path: |
            alpha_oracle.log
            active_signals.json
            trade_history.json
          retention-days: 3
