name: Alpha Oracle Pro

on:
  schedule:
    - cron: "*/15 * * * *"
  
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha-oracle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    name: 🤖 Alpha Oracle Pro
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies (with retry)
        run: |
          python -m pip install --upgrade pip
          
          echo "🔄 安裝依賴 (最多重試 3 次)..."
          for i in {1..3}; do
            if pip install requests websockets pandas numpy --quiet; then
              echo "✅ 依賴安裝成功"
              break
            else
              echo "⚠️ 第 $i 次安裝失敗，重試中..."
              sleep 2
            fi
          done
          
          # 🔍 驗證安裝
          echo "🔍 驗證已安裝套件："
          pip list | grep -E "requests|websockets|pandas|numpy" || echo "❌ 套件安裝可能失敗"

      - name: 🗄️ Init Files
        run: |
          [ -f active_signals.json ] || echo '{}' > active_signals.json
          [ -f trade_history.json ] || echo '[]' > trade_history.json
          touch alpha_oracle.log
          echo "✅ 檔案初始化完成"

      - name: 🔍 Environment Check
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          echo "═══════════════════════════════════"
          echo "🔍 環境變數檢查"
          echo "═══════════════════════════════════"
          
          # 檢查 TG_TOKEN
          if [ -z "$TG_TOKEN" ]; then
            echo "❌ TG_TOKEN 未設定！"
            echo "  請到 Settings → Secrets → Actions 設定"
            exit 1
          else
            echo "✅ TG_TOKEN: 已設定 (${#TG_TOKEN} 字元)"
          fi
          
          # 檢查 CHAT_ID
          if [ -z "$CHAT_ID" ]; then
            echo "❌ CHAT_ID 未設定！"
            exit 1
          else
            echo "✅ CHAT_ID: ${CHAT_ID:0:10}..."
          fi
          
          # 測試 Telegram 連接
          echo ""
          echo "📤 測試 Telegram 連接..."
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=🧪 Alpha Oracle Pro 測試" \
            -d "parse_mode=Markdown")
          
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "✅ Telegram 連接成功"
          else
            echo "❌ Telegram 連接失敗"
            echo "📝 API 回應: $RESPONSE"
            echo ""
            echo "💡 常見原因："
            echo "  1. TG_TOKEN 錯誤"
            echo "  2. CHAT_ID 錯誤 (群組需加 -100)"
            echo "  3. Bot 被封鎖或未啟動"
            exit 1
          fi
          
          echo "═══════════════════════════════════"

      - name: 🚀 Run Alpha Oracle Pro (Debug Mode)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          
          # 🔹 專業版配置 (先禁用複雜功能除錯)
          USE_WEBSOCKET: "false"          # 🔹 先禁用 WebSocket 測試
          CANDLE_CLOSE_MODE: "false"
          DAILY_SL_LIMIT: "2"
          MULTI_TF_CONFIRMATION: "false"  # 🔹 先禁用多時框
          VOLUME_CONFIRMATION: "false"
          CORRELATION_FILTER: "false"
          PRICE_DUAL_SOURCE: "false"      # 🔹 先禁用雙源價格
          REPORT_TIME: "22:00"
          
          MAX_SIGNALS: "3"
          SETUP_SCORE_THRESHOLD: "68"
          TZ: Asia/Taipei
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "."
        
        run: |
          echo "🚀 Alpha Oracle Pro v12.0 除錯模式啟動"
          echo "═══════════════════════════════════"
          echo "⚙️  配置："
          echo "  USE_WEBSOCKET: $USE_WEBSOCKET"
          echo "  MULTI_TF_CONFIRMATION: $MULTI_TF_CONFIRMATION"
          echo "  PRICE_DUAL_SOURCE: $PRICE_DUAL_SOURCE"
          echo "═══════════════════════════════════"
          
          # 🔹 執行並捕獲所有輸出
          set +e  # 不立即退出
          
          python main.py 2>&1 | tee execution.log
          EXIT_CODE=${PIPESTATUS[0]}
          
          set -e
          
          echo ""
          echo "═══════════════════════════════════"
          echo "📊 執行結果：退出碼 $EXIT_CODE"
          echo "═══════════════════════════════════"
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ 程式執行失敗"
            echo ""
            echo "🔍 錯誤日誌最後 50 行："
            echo "────────────────────"
            tail -50 execution.log
            echo "────────────────────"
            echo ""
            echo "💡 可能原因："
            echo "  1. 缺少依賴套件"
            echo "  2. 環境變數錯誤"
            echo "  3. 網路連接問題"
            echo "  4. 程式碼邏輯錯誤"
            exit $EXIT_CODE
          else
            echo "✅ 程式執行成功"
          fi

      - name: 📋 Show Full Logs (on failure)
        if: failure()
        run: |
          echo "🔍 完整執行日誌："
          echo "═══════════════════════════════════"
          cat execution.log 2>/dev/null || echo "❌ 無執行日誌"
          echo ""
          echo "🔍 應用程式日誌："
          echo "═══════════════════════════════════"
          cat alpha_oracle.log 2>/dev/null || echo "❌ 無應用程式日誌"

      - name: 💾 Save State
        if: always()
        run: |
          git config user.name "alpha-bot"
          git config user.email "bot@alpha-oracle.pro"
          git add -f active_signals.json trade_history.json alpha_oracle.log 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "🤖 auto: update state $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main --quiet || true
            git push origin main --quiet || git push --force-with-lease origin main --quiet
            echo "✅ 狀態已保存"
          fi
        continue-on-error: true

      - name: 📦 Upload Debug Artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-${{ github.run_id }}
          path: |
            execution.log
            alpha_oracle.log
            active_signals.json
            trade_history.json
          retention-days: 3
