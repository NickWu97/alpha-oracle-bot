name: Alpha Oracle Pro

on:
  schedule:
    # 🟢 掃描模式：活躍時段每 15 分鐘
    - cron: "*/15 1-5 * * *"    # 亞洲盤 09:00-13:00 TW
    - cron: "*/15 13-17 * * *"  # 歐美盤 21:00-01:00 TW
    
    # 🔵 監控模式：24 小時每 5 分鐘
    - cron: "*/5 * * * *"
    
    # 📊 每日戰報：台北時間 00:00
    - cron: "0 16 * * *"         # UTC 16:00 = TW 00:00

  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式'
        required: false
        default: 'scan'
        type: choice
        options: [scan, monitor_once, daily_report, command]
      command:
        description: 'Telegram 命令 (如: /stats)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: alpha-oracle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    name: 🤖 Alpha Oracle Pro
    runs-on: ubuntu-latest
    timeout-minutes: 3
    
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            main.py
            .github/workflows/
            active_signals.json
            trade_history.json
            daily_report.json

      - name: 🐍 Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: pip install requests pandas numpy --quiet

      - name: 🗄️ Init State Files
        run: |
          [ -f active_signals.json ] || echo '{}' > active_signals.json
          [ -f trade_history.json ] || echo '[]' > trade_history.json
          [ -f daily_report.json ] || echo '{"last_sent":""}' > daily_report.json
          touch alpha_oracle.log emergency_alerts.log

      - name: 🎯 Determine Mode
        id: mode
        run: |
          MODE="monitor_once"
          CMD=""
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
            CMD="${{ github.event.inputs.command }}"
          else
            HOUR=$(date -u +%H); MIN=$(date -u +%M)
            [[ "$MIN" =~ ^(00|15|30|45)$ ]] && MODE="scan"
            [[ "$HOUR" = "16" && "$MIN" -ge 0 && "$MIN" -lt 5 ]] && MODE="daily_report"
          fi
          
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "command=$CMD" >> $GITHUB_OUTPUT
          echo "MODE=$MODE" >> $GITHUB_ENV
          echo "COMMAND=$CMD" >> $GITHUB_ENV

      - name: 🚀 Run Alpha Oracle Pro
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MAX_SIGNALS: "6"
          SETUP_SCORE_THRESHOLD: "68"
          CONFIRM_TP_ON_CLOSE: "true"
          TZ: Asia/Taipei
        run: |
          if [ "$MODE" = "command" ] && [ -n "$COMMAND" ]; then
            echo "💬 執行命令: $COMMAND"
            python main.py --mode command --command "$COMMAND"
          else
            echo "🔄 執行模式: $MODE"
            python main.py --mode $MODE
          fi

      - name: 🚨 Emergency Fallback
        if: always()
        run: |
          [ -s emergency_alerts.log ] && {
            tail -3 emergency_alerts.log | while read line; do
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
                -d chat_id="${{ secrets.CHAT_ID }}" \
                -d text="🚨 [備援] $line" \
                -d parse_mode="Markdown" || true
            done
            > emergency_alerts.log
          }

      - name: 💾 Sync State
        if: always()
        run: |
          git config user.name "alpha-oracle-bot"
          git config user.email "bot@alpha-oracle.pro"
          git add -f active_signals.json trade_history.json daily_report.json alpha_oracle.log 2>/dev/null || true
          git diff --staged --quiet || {
            git commit -m "🤖 state: $MODE [skip ci]"
            git pull --rebase origin main --quiet || true
            git push origin main --quiet || git push --force-with-lease origin main --quiet
          }
        continue-on-error: true
