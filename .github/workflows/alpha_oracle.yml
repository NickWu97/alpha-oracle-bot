name: Alpha-Oracle-Official
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  run_bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install requests pandas numpy
      - name: Run Official Bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
      - name: Commit Logs
        run: |
          git config --global user.name "Alpha-Bot"
          git config --global user.email "bot@alpha.com"
          git add active_trades.csv trade_history.csv || true
          git commit -m "Sync trade data" || true
          git push || true
