name: Alpha Oracle Bot

on:
  schedule:
    # 每 15 分鐘執行一次 (對應你的 15m K線策略)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # 允許手動觸發測試
    inputs:
      manual_report:
        description: '是否手動觸發戰報 (true/false)'
        default: 'false'

permissions:
  contents: write  # 重要：允許機器人寫回 CSV 紀錄

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy pytz

      - name: Run Bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MANUAL_REPORT: ${{ github.event.inputs.manual_report || 'false' }}
        run: python main.py  # 這裡已經幫你改好對應你的檔名了

      - name: Commit and Push Changes
        # 自動將更新後的 CSV 檔案存回 GitHub，防止機器人失憶
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add active_trades.csv daily_stats.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 機器人自動更新交易紀錄 [skip ci]" && git push)
