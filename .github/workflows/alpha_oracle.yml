name: Alpha Oracle v9.1.6 - Auto Trading Bot

on:
  schedule:
    # 🟢 掃描模式：僅在活躍時段每 15 分鐘執行
    - cron: "*/15 1-5 * * *"     # 亞洲盤 (UTC)
    - cron: "*/15 13-17 * * *"   # 歐美盤 (UTC)
    
    # 🔵 監控模式：24小時每 5 分鐘檢查既有訊號
    - cron: "*/5 * * * *"
    
    # 📊 戰報模式
    - cron: "5 16 * * *"         # 每日戰報 (UTC 16:05)
    - cron: "10 16 1 * *"        # 月度戰報 (每月1日 UTC 16:10)

  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式'
        required: false
        default: 'scan'
        type: choice
        options:
          - scan
          - monitor_once
          - daily_report
          - monthly_report
          - status_check

permissions:
  contents: write

concurrency:
  group: alpha-oracle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-alpha-oracle:
    name: Run Alpha Oracle Bot
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. 下載程式碼
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. 設置 Python (移除 cache 避免缺少 requirements.txt 報錯)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安裝依賴
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      # 4. 🔧 確保狀態文件存在 (修復 pathspec 錯誤)
      - name: Initialize State Files
        run: |
          # 若文件不存在則建立，避免 git add 報錯
          [ -f active_signals.json ] || echo '{}' > active_signals.json
          [ -f trade_history.json ] || echo '[]' > trade_history.json
          [ -f daily_stats.csv ] || echo 'instId,result,date' > daily_stats.csv
          touch alpha_oracle.log
          echo "✅ State files initialized"

      # 5. 智能判斷執行模式
      - name: Determine Execution Mode
        id: determine_mode
        run: |
          MODE="monitor_once"
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            HOUR=$(date -u +%H)
            MIN=$(date -u +%M)
            DAY=$(date -u +%d)
            HOUR_INT=$((10#$HOUR))
            MIN_INT=$((10#$MIN))

            if [ "$HOUR_INT" -eq 16 ] && [ "$MIN_INT" -ge 5 ] && [ "$MIN_INT" -lt 10 ]; then
              MODE="daily_report"
            elif [ "$DAY" -eq 1 ] && [ "$HOUR_INT" -eq 16 ] && [ "$MIN_INT" -ge 10 ] && [ "$MIN_INT" -lt 15 ]; then
              MODE="monthly_report"
            elif [[ "$MIN" =~ ^(00|15|30|45)$ ]]; then
              MODE="scan"
            else
              MODE="monitor_once"
            fi
          fi
          
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "MODE=$MODE" >> $GITHUB_ENV # 存入環境變數供後續步驟使用
          echo "🎯 Selected Mode: $MODE"

      # 6. 執行主程式
      - name: Run Alpha Oracle
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MAX_SIGNALS: "6"
          SETUP_SCORE_THRESHOLD: "68"
          CONFIRM_TP_ON_CLOSE: "true"
          DEBUG_MODE: "false"
          TZ: "Asia/Taipei"
        run: |
          echo "🚀 Starting Alpha Oracle in mode: $MODE"
          python main.py --mode $MODE

      # 7. 提交狀態更新 (強化容錯)
      - name: Commit and Push State Changes
        if: always()
        run: |
          git config user.name "alpha-oracle-bot"
          git config user.email "bot@alpha-oracle.local"
          
          # 使用 --ignore-unmatched 忽略不存在的文件，避免 fatal 錯誤
          git add --ignore-unmatched active_signals.json trade_history.json daily_stats.csv alpha_oracle.log 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "ℹ️ No state changes to commit."
          else
            git commit -m "🤖 bot: update state [$MODE] [skip ci]"
            
            # 安全拉取與推送
            git pull --rebase origin main || true
            git push origin main || git push --force-with-lease origin main
            echo "✅ State files committed and pushed."
          fi
        continue-on-error: true
