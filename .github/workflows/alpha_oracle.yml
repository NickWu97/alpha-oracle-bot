name: Alpha Oracle Pro - Instant TP/SL Alerts

on:
  schedule:
    # 🟢 掃描模式：活躍時段每 10 分鐘
    - cron: "*/10 1-5 * * *"     # 亞洲盤 (UTC)
    - cron: "*/10 13-17 * * *"   # 歐美盤 (UTC)
    
    # 🔵 監控模式：24小時每 2 分鐘 (關鍵！)
    - cron: "*/2 * * * *"
    
    # 📊 戰報模式
    - cron: "5 16 * * *"          # 每日戰報 (台北時間 00:05)
    - cron: "10 16 1 * *"         # 月度戰報 (每月1日 台北時間 00:10)

  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式'
        required: false
        default: 'scan'
        type: choice
        options: [scan, monitor_once, daily_report, monthly_report, status_check]
      emergency:
        description: '啟用緊急模式 (縮短超時/重試)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

concurrency:
  group: alpha-oracle-pro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-alpha-oracle-pro:
    name: Run Alpha Oracle Pro
    runs-on: ubuntu-latest
    timeout-minutes: 3
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            main.py
            .github/workflows/
            active_signals.json
            trade_history.json
            daily_stats.csv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Initialize State Files
        run: |
          [ -f active_signals.json ] || echo '{}' > active_signals.json
          [ -f trade_history.json ] || echo '[]' > trade_history.json
          [ -f daily_stats.csv ] || echo 'instId,result,date' > daily_stats.csv
          touch alpha_oracle.log emergency_alerts.log

      - name: Determine Mode
        id: determine_mode
        run: |
          MODE="monitor_once"
          EMERGENCY="${{ github.event.inputs.emergency || 'false' }}"
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            HOUR=$(date -u +%H); MIN=$(date -u +%M); DAY=$(date -u +%d)
            HOUR_INT=$((10#$HOUR)); MIN_INT=$((10#$MIN))
            
            if [ "$HOUR_INT" -eq 16 ] && [ "$MIN_INT" -ge 5 ] && [ "$MIN_INT" -lt 10 ]; then
              MODE="daily_report"
            elif [ "$DAY" -eq 1 ] && [ "$HOUR_INT" -eq 16 ] && [ "$MIN_INT" -ge 10 ] && [ "$MIN_INT" -lt 15 ]; then
              MODE="monthly_report"
            elif [[ "$MIN" =~ ^(00|10|20|30|40|50)$ ]]; then
              MODE="scan"
            else
              MODE="monitor_once"
            fi
          fi
          
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "MODE=$MODE" >> $GITHUB_ENV
          echo "EMERGENCY=$EMERGENCY" >> $GITHUB_ENV
          echo "🎯 Mode: $MODE | Emergency: $EMERGENCY"

      - name: Run Alpha Oracle Pro
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MAX_SIGNALS: "6"
          SETUP_SCORE_THRESHOLD: "68"
          CONFIRM_TP_ON_CLOSE: "true"
          DEBUG_MODE: "false"
          TZ: "Asia/Taipei"
          EMERGENCY_MODE: ${{ env.EMERGENCY }}
        run: |
          echo "🚀 Alpha Oracle Pro 啟動 | Mode: $MODE | Emergency: $EMERGENCY"
          if [ "$EMERGENCY" = "true" ]; then
            export CONFIRM_TP_ON_CLOSE="false"
            echo "⚠️ 緊急模式：已關閉收盤確認以加速通知"
          fi
          python main.py --mode $MODE

      - name: Check Emergency Alerts
        if: always()
        run: |
          if [ -s emergency_alerts.log ]; then
            echo "⚠️ 發現緊急日誌，嘗試發送..."
            tail -5 emergency_alerts.log | while read line; do
              curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -d chat_id="${CHAT_ID}" \
                -d text="🚨 [緊急備援] $line" \
                -d parse_mode="Markdown" || true
            done
            > emergency_alerts.log
          fi

      - name: Commit State Changes
        if: always()
        run: |
          git config user.name "alpha-oracle-pro-bot"
          git config user.email "bot@alpha-oracle.pro"
          
          git add --ignore-unmatched active_signals.json trade_history.json daily_stats.csv alpha_oracle.log emergency_alerts.log 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "🤖 pro: state update [$MODE] [skip ci]"
            git pull --rebase origin main || true
            git push origin main || git push --force-with-lease origin main
            echo "✅ 狀態已同步"
          else
            echo "ℹ️  無狀態變更"
          fi
        continue-on-error: true
