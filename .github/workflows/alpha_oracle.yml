name: Alpha Oracle Bot

on:
  schedule:
    - cron: '*/15 * * * *'   # 每 15 分鐘掃描
    - cron: '0 16 * * *'     # UTC 16:00 = 台灣 00:00（午夜戰報）
  workflow_dispatch:
    inputs:
      run_mode:
        description: '執行模式：scan(掃描) 或 report(戰報)'
        required: false
        default: 'scan'
        type: choice
        options: [scan, report]

# ⭐ 防止定時任務重疊執行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # 設定 10 分鐘超時（掃描不應超過此時間）
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run Alpha Oracle
        env:
          TG_TOKEN:      ${{ secrets.TG_TOKEN }}
          CHAT_ID:       ${{ secrets.CHAT_ID }}
          RUN_MODE:      ${{ github.event.inputs.run_mode || 'scan' }}
        run: python main.py

      # ⭐ 安全提交狀態檔（僅在有變更時執行）
      - name: Commit & Push State
        if: success()
        run: |
          git config user.name  "alpha-oracle-bot"
          git config user.email "bot@alpha-oracle"
          git add -f active_trades.csv daily_stats.csv midnight.log 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "📦 無狀態變更，跳過提交"
          else
            echo "📤 提交狀態檔..."
            git commit -m "chore: update trade state [skip ci]"
            # ⭐ 避免並行執行導致 push 衝突
            git pull --rebase origin main
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
