name: Alpha Oracle Bot

on:
  schedule:
    # 每 15 分鐘執行一次 (對應 15m K線)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      manual_report:
        description: '是否手動觸發戰報 (true/false)'
        default: 'false'

permissions:
  contents: write  # 允許腳本將 CSV 檔案寫回 GitHub 倉庫

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy pytz

      - name: Run Bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # 讀取手動觸發參數或默認 false
          MANUAL_REPORT: ${{ github.event.inputs.manual_report || 'false' }}
        run: python your_script_name.py  # <--- 這裡記得改你的檔名

      - name: Commit and Push Changes
        # 這個步驟至關重要：它會把腳本更新後的 CSV 提交回倉庫
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add active_trades.csv daily_stats.csv
          # 只有在檔案有變動時才 commit，避免報錯
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update trade logs [skip ci]" && git push)
