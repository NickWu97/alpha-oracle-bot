name: Alpha Oracle Bot

on:
  schedule:
    # ── 亞洲盤（UTC 01:00~05:00）每15分鐘 ──
    - cron: "*/15 1-5 * * *"
    # ── 歐美盤（UTC 13:00~17:00）每15分鐘 ──
    - cron: "*/15 13-17 * * *"
    # ── 其他時段每60分鐘掃一次（保底）──
    - cron: "0 0,6,7,8,9,10,11,12,18,19,20,21,22,23 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: 🚀 Run Alpha Oracle (using main.py)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MAX_SIGNALS: "6"
        # ✅ 修正點：將檔名改為實際存在的 main.py
        run: python main.py --mode scan
