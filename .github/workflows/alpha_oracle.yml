name: Alpha Oracle v9.0

# ════════════════════════════════════════════════════════════════
# GitHub Actions 2000分鐘/月 預算規劃
# ────────────────────────────────────────────────────────────────
# 亞洲盤 UTC 01-05（台灣09-13）每15分鐘 → 4×5×31 = 620 runs
# 歐美盤 UTC 13-17（台灣21-01）每15分鐘 → 4×5×31 = 620 runs
# 每日戰報 UTC 00:05                     → 31 runs/月
# 月度戰報 UTC 00:10 每月1日             → 1 run/月
# ────────────────────────────────────────────────────────────────
# 合計 ≈ 1272 runs × 1.5 分鐘 ≈ 1908 分鐘 < 2000 分鐘 ✓
#
# ⚠️  注意：private repo 每分鐘計 1 點，超過 2000 分鐘/月需付費
#     如不想超額，請勿改回 */10 * * * * 的全天掃描！
# ════════════════════════════════════════════════════════════════
on:
  schedule:
    - cron: "*/15 1-5 * * *"    # 亞洲盤 UTC 01:00-05:59 每15分鐘
    - cron: "*/15 13-17 * * *"  # 歐美盤 UTC 13:00-17:59 每15分鐘
    - cron: "5 0 * * *"         # 每日戰報 UTC 00:05（台灣 08:05）
    - cron: "10 0 1 * *"        # 月度戰報 每月1日 UTC 00:10

  workflow_dispatch:             # 手動觸發（測試 / 緊急用）
    inputs:
      mode:
        description: "執行模式"
        required: true
        default: "scan"
        type: choice
        options:
          - scan
          - daily_report
          - monthly_report
          - status
      max_signals:
        description: "本輪最大訊號數（預設 6）"
        required: false
        default: "6"
        type: string

permissions:
  contents: write                # 允許 git push 寫入狀態檔案

jobs:
  alpha-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 8           # 防止意外無限循環，最多跑 8 分鐘

    steps:
      # ── 1. 取得最新程式碼（含上次 commit 的狀態檔）
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. 安裝依賴（無 requirements.txt 也能跑）
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests pandas numpy
          fi

      # ── 4. 判斷執行模式
      #      手動觸發 → 用輸入的 mode
      #      定時觸發 → 依時間自動判斷
      - name: Determine mode
        id: mode
        run: |
          # 手動觸發時直接用使用者輸入
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            echo "max_signals=${{ github.event.inputs.max_signals || '6' }}" >> $GITHUB_OUTPUT
            echo "[手動] mode=${{ github.event.inputs.mode }}"
            exit 0
          fi

          # 定時觸發：依 UTC 時間自動選擇模式
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          DAY=$(date -u +%d)

          if [ "$DAY" = "01" ] && [ "$HOUR" = "00" ] && [ "$MIN" -ge "10" ] && [ "$MIN" -lt "20" ]; then
            MODE="monthly_report"
          elif [ "$HOUR" = "00" ] && [ "$MIN" -ge "05" ] && [ "$MIN" -lt "15" ]; then
            MODE="daily_report"
          else
            MODE="scan"
          fi

          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "max_signals=6" >> $GITHUB_OUTPUT
          echo "[自動] UTC ${HOUR}:${MIN} → mode=$MODE"

      # ── 5. 執行機器人
      - name: Run Alpha Oracle
        env:
          TG_TOKEN:    ${{ secrets.TG_TOKEN }}
          CHAT_ID:     ${{ secrets.CHAT_ID }}
          MAX_SIGNALS: ${{ steps.mode.outputs.max_signals }}
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          echo "==============================="
          echo "  Alpha Oracle v9.0"
          echo "  mode        = $MODE"
          echo "  max_signals = $MAX_SIGNALS"
          echo "  time(UTC)   = $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "==============================="
          python main.py --mode "$MODE"

      # ── 6. 提交狀態檔案回 repo（讓下次 run 繼承訊號追蹤 & 交易歷史）
      #      使用 [skip ci] 讓這次 commit 不觸發新的 workflow
      - name: Commit state files
        if: always()
        run: |
          git config user.name  "alpha-oracle[bot]"
          git config user.email "alpha-oracle[bot]@users.noreply.github.com"
          git remote set-url origin \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          # 強制加入狀態檔（即使在 .gitignore 裡也能加）
          git add -f active_signals.json trade_history.json 2>/dev/null || true
          # log 選擇性加入（避免 log 太大）
          git add -f alpha_oracle.log 2>/dev/null || true

          # 只有有變動才 commit，避免空 commit
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "bot: update state [skip ci]"
            git push
            echo "State files committed successfully."
          fi
        continue-on-error: true  # git push 失敗不影響主流程

      # ── 7. 上傳日誌 Artifact（方便手動查 log，保留 7 天）
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-log-${{ github.run_id }}
          path: |
            alpha_oracle.log
            active_signals.json
            trade_history.json
          retention-days: 7
          if-no-files-found: ignore

      # ── 8. 執行失敗時發 Telegram 告警
      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "'"${{ secrets.CHAT_ID }}"'",
              "text": "❌ *Alpha Oracle 執行失敗*\n\n時間：'"$(date -u '+%Y-%m-%d %H:%M UTC')"'\n請到 GitHub Actions 查看錯誤日誌。",
              "parse_mode": "Markdown"
            }' || true
