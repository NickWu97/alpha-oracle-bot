name: Alpha Oracle Bot

# ═══════════════════════════════════════════════════════════════
# 觸發條件
# ═══════════════════════════════════════════════════════════════
on:
  # ✅ 手動觸發（點擊 Run workflow 按鈕）
  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式 (scan=掃描一次 / stats=發送績效)'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - stats
          - daily_report
      all_coins:
        description: '掃描所有 OKX 合約（預設僅主流幣）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      max_signals:
        description: '本輪最大發送訊號數'
        required: false
        default: '15'
        type: number

  # ⏰ 定時觸發（每 10 分鐘執行一次掃描）
  schedule:
    - cron: '*/10 * * * *'

  # 📦 Push 觸發（程式碼更新時自動測試）
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'config.yaml'
      - 'requirements.txt'
      - '.github/workflows/alpha_oracle.yml'

# ═══════════════════════════════════════════════════════════════
# 環境變數
# ═══════════════════════════════════════════════════════════════
env:
  PYTHON_VERSION: '3.11'
  TZ: 'Asia/Taipei'
  PIP_DISABLE_PIP_VERSION_CHECK: 1

# ═══════════════════════════════════════════════════════════════
# 工作定義
# ═══════════════════════════════════════════════════════════════
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12  # 防止無限循環佔用額度

    steps:
      # 1. 下載程式碼
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2. 設定 Python 環境
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # 3. 安裝依賴
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          # 安裝 v10.0 新增的選配套件
          pip install pyyaml matplotlib requests pandas numpy

      # 4. 自動生成配置檔（若不存在）
      - name: 📂 Prepare Config & Directories
        run: |
          mkdir -p logs
          if [ ! -f config.yaml ]; then
            echo "⚙️ 自動生成 config.yaml..."
            cat > config.yaml << 'EOF'
            scan:
              timeframes: ["15m", "30m"]
              max_signals_per_run: 15
              score_threshold: 75
              parallel_workers: 8
              cache_ttl_seconds: 30
            risk:
              risk_per_trade_pct: 1.0
              max_correlation_exposure: 3
              volatility_adjustment: true
              max_total_exposure_pct: 10.0
            monitor:
              entry_tolerance: 0.002
              signal_expire_hours: 24
              check_interval_seconds: 30
            telegram:
              enable_commands: false
              stats_chart_enabled: true
            EOF
          fi
          echo "✅ 環境準備完成"

      # 5. 執行機器人
      - name: 🤖 Run Alpha Oracle
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MAX_SIGNALS: ${{ github.event.inputs.max_signals || '15' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'scan' }}"
          ALL_COINS="${{ github.event.inputs.all_coins || 'false' }}"
          
          echo "🚀 啟動 Alpha Oracle v10.0"
          echo "📊 模式: $MODE"
          echo "🌍 全市場掃描: $ALL_COINS"
          echo " 最大訊號數: $MAX_SIGNALS"
          echo "━━━━━━━━━━━━━━━━━━━━━━"
          
          # 組合執行指令
          CMD="python main.py --mode $MODE --config config.yaml"
          
          if [ "$ALL_COINS" = "true" ]; then
            CMD="$CMD --all-coins"
          fi
          
          # 執行並即時輸出日誌
          $CMD 2>&1 | tee logs/runtime.log
          
          echo "━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ 執行完畢"

      # 6. 上傳日誌與狀態檔（無論成功失敗都上傳）
      - name: 📤 Upload Logs & State
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-oracle-artifacts-${{ github.run_id }}
          path: |
            logs/
            alpha_oracle.log
            trade_history.json
            active_signals.json
            stats_chart.png
            config.yaml
          retention-days: 3
          overwrite: true

      # 7. 失敗時發送 Telegram 通知
      - name: 📢 Notify Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "'"${{ secrets.CHAT_ID }}"'",
              "text": "❌ *Alpha Oracle 執行失敗*\n\n請查看 GitHub Actions 日誌下載詳細錯誤。",
              "parse_mode": "Markdown"
            }'
