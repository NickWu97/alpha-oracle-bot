name: Alpha Oracle Position Tracker

on:
  schedule:
    # 每 15 分鐘執行一次，確保捕捉 15m K 線的 BoS 突破與 CVD 背離
    - cron: '*/15 * * * *'
  workflow_dispatch: # 允許你隨時在 Actions 頁面手動點擊執行測試

jobs:
  build:
    runs-on: ubuntu-latest
    # 給予寫入權限，讓 Actions 可以把交易紀錄檔 (csv) 推送回倉庫
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run Alpha Oracle Bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Save Trade Logs and Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 檢查是否有檔案變動，如果有則提交
          git add active_trades.csv daily_ok.txt || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Alpha Oracle trade logs [skip ci]"
            git push
          fi
