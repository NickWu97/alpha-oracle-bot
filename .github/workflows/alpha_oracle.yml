name: Alpha Oracle Pro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: pip install requests --quiet

      - name: 🗄️ Init Files
        run: |
          [ -f active_signals.json ] || echo '{}' > active_signals.json
          [ -f trade_history.json ] || echo '[]' > trade_history.json

      - name: 🚀 Run Bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MAX_SIGNALS: "3"
          SETUP_SCORE_THRESHOLD: "68"
        run: python main.py

      - name: 💾 Save State
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add -f active_signals.json trade_history.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "update state"
          git push || true
        continue-on-error: true
