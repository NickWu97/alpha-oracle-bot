name: Alpha-Oracle-TEST-MODE

on:
  schedule:
    - cron: '*/5 * * * *' # 測試期間每 5 分鐘跑一次
  workflow_dispatch:

jobs:
  test_run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install requests pandas numpy
      - name: Run Test Bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
      - name: Save Test Logs
        run: |
          git config --global user.name "AlphaTester"
          git config --global user.email "test@alpha.com"
          git add active_trades.csv trade_history.csv daily.ok || true
          git commit -m "Test Log Update [skip ci]" || true
          git push || true
