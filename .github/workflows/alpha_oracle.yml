name: Alpha Oracle Bot

on:
  # ── 定時自動掃描（每15分鐘一次）──────────────
  schedule:
    - cron: "0,15,30,45 * * * *"   # 每小時的 0/15/30/45 分執行

  # ── 手動觸發（測試用）────────────────────────
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # ← 硬性限制：10分鐘內必須結束，防止卡死

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alpha Oracle (scan only)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID:  ${{ secrets.CHAT_ID }}
          MAX_SIGNALS: "8"
        # --mode scan = 掃描完立即退出，不進入監控迴圈
        run: python alpha_oracle_v8.1.py --mode scan
