name: Alpha Oracle Position Tracker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run Bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Commit Trade Log # 這段是新增的，負責儲存持倉紀錄
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          git add active_trades.csv report_done.txt || true
          git commit -m "Update trade logs" || true
          git push || true
