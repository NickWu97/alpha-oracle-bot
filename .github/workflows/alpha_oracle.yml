name: Alpha Oracle Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      send_report:
        description: '立刻發送連線測試與報表？'
        required: false
        default: false
        type: boolean

jobs:
  run-bot:
    runs-on: ubuntu-latest
    concurrency:
      group: trading-bot
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run Main Script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MANUAL_REPORT: ${{ github.event.inputs.send_report }}
        run: python main.py

      - name: Save Logs
        run: |
          git config --global user.name "GitHub Bot"
          git config --global user.email "bot@github.com"
          git add active_trades.csv daily_stats.csv
          git commit -m "Update logs [skip ci]" || exit 0
          git push
