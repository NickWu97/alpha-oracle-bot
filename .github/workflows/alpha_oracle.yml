name: Alpha Oracle Bot

on:
  schedule:
    - cron: '*/15 * * * *'   # 每 15 分鐘執行一次
    - cron: '0 16 * * *'     # 每天 UTC 16:00 (台灣 00:00)
  workflow_dispatch:
    inputs:
      run_mode:
        description: '執行模式'
        required: false
        default: 'scan'
        type: choice
        options: [scan, monitor, all]
      max_duration:
        description: '最大運行時間（秒）'
        required: false
        default: '300'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. 拉取代碼
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 設置 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安裝依賴
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      # ─────────────────────────────────────────────
      # 🔍 4. 自動尋找 Python 檔案 (修復步驟)
      # ─────────────────────────────────────────────
      - name: Find Python Script
        id: find_script
        run: |
          echo "📂 正在搜尋 Python 執行檔..."
          
          # 優先尋找 alpha_oracle_v8.1.py
          if [ -f "alpha_oracle_v8.1.py" ]; then
            echo "SCRIPT_PATH=alpha_oracle_v8.1.py" >> $GITHUB_ENV
            echo "✅ 找到: alpha_oracle_v8.1.py"
            
          # 次選尋找 main.py
          elif [ -f "main.py" ]; then
            echo "SCRIPT_PATH=main.py" >> $GITHUB_ENV
            echo "✅ 找到: main.py (自動使用)"
            
          # 搜尋其他 .py 檔案
          else
            SCRIPT=$(find . -maxdepth 1 -name "*.py" | head -n 1)
            if [ -n "$SCRIPT" ]; then
              echo "SCRIPT_PATH=${SCRIPT#./}" >> $GITHUB_ENV
              echo "✅ 自動找到: $SCRIPT"
            else
              echo "❌ 錯誤：找不到任何 Python 檔案！"
              echo "請確認你的程式碼是否已 push 到 GitHub"
              ls -la
              exit 1
            fi
          fi

      # 5. 執行 Bot
      - name: Run Alpha Oracle
        env:
          TG_TOKEN:      ${{ secrets.TG_TOKEN }}
          CHAT_ID:       ${{ secrets.CHAT_ID }}
          MAX_SIGNALS:   ${{ vars.MAX_SIGNALS || '8' }}
        run: |
          # 使用上面找到的腳本路徑
          SCRIPT=${{ env.SCRIPT_PATH }}
          MODE="${{ github.event.inputs.run_mode || 'scan' }}"
          DURATION="${{ github.event.inputs.max_duration || '300' }}"
          
          echo "🚀 執行指令: python $SCRIPT --mode $MODE --max-duration $DURATION"
          python "$SCRIPT" \
            --mode "$MODE" \
            --max-duration "$DURATION" \
            --interval 30 \
            --loop-interval 900

      # 6. 上傳日誌
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: |
            *.log
            *.json
          retention-days: 3
          if-no-files-found: ignore
