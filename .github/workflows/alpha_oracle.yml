name: Alpha-Oracle-PRO-Official
on:
  schedule:
    - cron: '*/15 * * * *' # 正式版 15 分鐘一次
  workflow_dispatch: # 支援手動測試
jobs:
  pro_run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install requests pandas numpy
      - name: Run Official Bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
      - name: Save Records
        run: |
          git config --global user.name "AlphaOracle-Bot"
          git config --global user.email "bot@alpha-oracle.com"
          git add active_trades.csv trade_history.csv daily.ok || true
          git commit -m "Update Alpha Logs [skip ci]" || true
          git push || true
