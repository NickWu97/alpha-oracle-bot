name: Alpha Oracle Bot

on:
  schedule:
    - cron: '*/15 * * * *'        # 每 15 分钟扫描
    - cron: '0 16 * * *'          # 每天 UTC 16:00 = 台湾 00:00（午夜战报）
  workflow_dispatch:
    inputs:
      run_mode:
        description: '执行模式'
        required: false
        default: 'scan'
        type: choice
        options: [scan, report]
      max_duration:
        description: '最大运行时间（秒）'
        required: false
        default: '300'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy
      
      - name: Run Alpha Oracle
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID:  ${{ secrets.CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.run_mode || 'scan' }}"
          
          if [ "$MODE" == "report" ]; then
            echo "📊 发送每日战报..."
            python alpha_oracle_v8.2.py --report
          else
            echo "🚀 执行扫描..."
            python alpha_oracle_v8.2.py --mode scan --max-duration 300
          fi
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: |
            *.log
            *.json
          retention-days: 7
