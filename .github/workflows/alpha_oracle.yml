name: Alpha Oracle Pro - Instant TP/SL Alerts

on:
  schedule:
    # 🟢 掃描模式：活躍時段每 10 分鐘
    - cron: "*/10 1-5 * * *"     # 亞洲盤 (UTC)
    - cron: "*/10 13-17 * * *"   # 歐美盤 (UTC)
    
    # 🔵 監控模式：每 5 分鐘 (Actions 建議最低穩定頻率)
    - cron: "*/5 * * * *"
    
    # 📊 戰報模式
    - cron: "5 16 * * *"          # 每日戰報 (台北 00:05)
    - cron: "10 16 1 * *"         # 月度戰報 (每月1日 台北 00:10)

  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式'
        required: false
        default: 'scan'
        type: choice
        options: [scan, monitor_once, daily_report, monthly_report, status_check]
      emergency:
        description: '啟用緊急模式'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

concurrency:
  group: alpha-oracle-pro-sync
  cancel-in-progress: false

jobs:
  run-alpha-oracle-pro:
    name: Run Alpha Oracle Pro
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Initialize State Files
        run: |
          [ -f active_signals.json ] || echo '{}' > active_signals.json
          [ -f trade_history.json ] || echo '[]' > trade_history.json
          [ -f daily_stats.csv ] || echo 'instId,result,date' > daily_stats.csv
          touch alpha_oracle.log emergency_alerts.log

      - name: Run Alpha Oracle Pro
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MAX_SIGNALS: "12"
          SETUP_SCORE_THRESHOLD: "68"
        run: |
          # 判斷執行模式
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            # 根據 Cron 時間自動判斷（簡化邏輯）
            MODE="scan" 
          fi
          python main.py --mode $MODE

      - name: Commit State Changes
        if: always()
        run: |
          git config user.name "alpha-oracle-pro-bot"
          git config user.email "bot@alpha-oracle.pro"
          
          # 確保最新狀態，避免 Push 失敗
          git pull --rebase origin main || true
          
          git add active_signals.json trade_history.json daily_stats.csv alpha_oracle.log emergency_alerts.log 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "🤖 pro: state update [skip ci]"
            git push origin main || (git pull --rebase origin main && git push origin main)
            echo "✅ 狀態已同步"
          else
            echo "ℹ️ 無狀態變更"
          fi
