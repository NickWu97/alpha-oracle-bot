name: Alpha Oracle v9.1.3
on:
  schedule:
    # ═══════════════════════════════════════════════════════════
    # 掃描（生成新訊號 + 預檢既有訊號）— 每 15 分鐘
    # ═══════════════════════════════════════════════════════════
    - cron: "*/15 1-5 * * *"    # 亞洲盤
    - cron: "*/15 13-17 * * *"  # 歐美盤

    # ═══════════════════════════════════════════════════════════
    # ✨ 高頻監控（只檢查既有訊號的 TP/SL 觸發）— 每 5 分鐘
    # 避免漏掉 TP/SL；不產生新訊號，純粹同步狀態與推播
    # 注意：GitHub Actions 免費額度 2000 min/月；5 min cron × 20s ≈ 200 min/月，OK
    # 若要節省額度，可改為 */10 或只在交易時段啟用
    # ═══════════════════════════════════════════════════════════
    - cron: "*/5 * * * *"       # 24h 每 5 分鐘檢查

    # ═══════════════════════════════════════════════════════════
    # 戰報
    # ═══════════════════════════════════════════════════════════
    - cron: "5 0 * * *"         # 每日戰報 00:05 UTC
    - cron: "10 0 1 * *"        # 月度戰報 每月 1 日 00:10 UTC

  workflow_dispatch:
    inputs:
      mode:
        description: "執行模式"
        required: false
        default: "scan"
        type: choice
        options:
          - scan
          - monitor_once
          - daily_report
          - monthly_report

permissions:
  contents: write

# 避免同一模式的兩次執行互踩（active_signals.json 寫入衝突）
concurrency:
  group: alpha-oracle-state
  cancel-in-progress: false

jobs:
  alpha-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Determine mode
        id: mode
        run: |
          # 手動觸發優先吃 inputs.mode
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          DAY=$(date -u +%d)
          MIN_INT=$((10#$MIN))

          # 月度戰報：每月 1 日 00:10 UTC（±5 min 容差）
          if [ "$DAY" = "01" ] && [ "$HOUR" = "00" ] && [ "$MIN_INT" -ge 10 ] && [ "$MIN_INT" -lt 15 ]; then
            echo "mode=monthly_report" >> $GITHUB_OUTPUT
          # 每日戰報：00:05 UTC（±5 min 容差）
          elif [ "$HOUR" = "00" ] && [ "$MIN_INT" -ge 5 ] && [ "$MIN_INT" -lt 10 ]; then
            echo "mode=daily_report" >> $GITHUB_OUTPUT
          # 每 15 分鐘的 00/15/30/45 分 → scan（主要掃描模式）
          elif [ "$MIN" = "00" ] || [ "$MIN" = "15" ] || [ "$MIN" = "30" ] || [ "$MIN" = "45" ]; then
            # 只在亞洲/歐美盤啟動 scan，其他時段仍跑 monitor_once
            if { [ "$HOUR" -ge 1 ] && [ "$HOUR" -le 5 ]; } || { [ "$HOUR" -ge 13 ] && [ "$HOUR" -le 17 ]; }; then
              echo "mode=scan" >> $GITHUB_OUTPUT
            else
              echo "mode=monitor_once" >> $GITHUB_OUTPUT
            fi
          # 其他分鐘（5/10/20/25/35/40/50/55）→ monitor_once 輕量模式
          else
            echo "mode=monitor_once" >> $GITHUB_OUTPUT
          fi

      - name: Run Alpha Oracle (${{ steps.mode.outputs.mode }})
        env:
          TG_TOKEN:    ${{ secrets.TG_TOKEN }}
          CHAT_ID:     ${{ secrets.CHAT_ID }}
          MAX_SIGNALS: "6"
        run: python main.py --mode ${{ steps.mode.outputs.mode }}

      - name: Commit state files
        if: always()
        run: |
          git config user.name  "alpha-oracle[bot]"
          git config user.email "alpha-oracle[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          # 用 rebase 降低 race condition（多個 cron 同時寫檔時）
          git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true

          git add -f active_signals.json trade_history.json alpha_oracle.log 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "bot: state update [${{ steps.mode.outputs.mode }}] [skip ci]"
            # 再 pull 一次避免 push 時 non-fast-forward
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
            git push || git push --force-with-lease
          fi
        continue-on-error: true
