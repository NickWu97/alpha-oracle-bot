  #         TG_TOKEN: ${{ secrets.TG_TOKEN }}
  #         CHAT_ID: ${{ secrets.CHAT_ID }}
  #       run: |
  #         # 解析日誌並發送摘要
  #         if [ -f "alpha_oracle_v6.log" ]; then
  #           SIGNALS_SENT=$(grep -c "Signal.*sent" alpha_oracle_v6.log || echo "0")
  #           ERRORS=$(grep -c "ERROR" alpha_oracle_v6.log || echo "0")
  #           
  #           MSG="📊 *Alpha Oracle 執行摘要*\n"
  #           MSG+="──────────────────\n"
  #           MSG+="⏰ 時間: $(date '+%Y-%m-%d %H:%M')\n"
  #           MSG+="🎯 模式: ${{ env.SCORE_MODE }}\n"
  #           MSG+="📡 發送訊號: $SIGNALS_SENT 個\n"
  #           MSG+="❌ 錯誤數量: $ERRORS 個\n"
  #           MSG+="\n🔗 [查看詳細日誌](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
  #           
  #           curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
  #             -H "Content-Type: application/json" \
  #             -d "{\"chat_id\": \"$CHAT_ID\", \"text\": \"$MSG\", \"parse_mode\": \"Markdown\"}"
  #         fi

# ─────────────────────────────────────────────
# 📋 使用說明
# ─────────────────────────────────────────────
# 1️⃣ 前置準備：
#    • 在 Repo Settings → Actions → General → Workflow permissions
#      選擇 "Read and write permissions" ✅
#    • 在 Settings → Secrets and variables → Actions → Secrets
#      添加以下 Secrets:
#      - TG_TOKEN: 您的 Telegram Bot Token
#      - CHAT_ID: 您的 Chat ID  
#      - COINANK_API_KEY: (可選) CoinAnk API Key
#      - GLASSNODE_API_KEY: (可選) Glassnode API Key
#      - CRYPTOQUANT_API_KEY: (可選) CryptoQuant API Key
#
# 2️⃣ 手動觸發方式：
#    • 進入 Actions → 🤖 Alpha Oracle Bot → Run workflow
#    • 可選擇:
#      - 📊 手動戰績回報: 立即發送午夜報告
#      - 🎯 評分模式: conservative(70 分)/balanced(55 分)/aggressive(40 分)
#      - 🔢 最大信號數: 限制本次運行的信號數量
#
# 3️⃣ 狀態文件說明：
#    • active_trades.csv: 追蹤中的持倉狀態
#    • daily_stats.csv: 每日戰績統計
#    • pending_signals.json: 待進場信號監控
#    • whale_optimization.json: 動態閾值優化參數
#    • midnight.ok: 午夜報告發送標記
#    • 這些文件會自動 commit 回 repo，確保狀態持續
#
# 4️⃣ 除錯技巧：
#    • 查看失敗日誌：Actions → 失敗的 run → 📤 Upload Logs artifact
#    • 本地測試：複製環境變數後運行 `python main.py`
#    • 開啟 DEBUG：添加 env: LOG_LEVEL: DEBUG
#
# 5️⃣ 常見問題：
#    ❓ Q: 狀態文件沒更新？
#    ✅ A: 檢查 Workflow permissions 是否為 "Read and write"
#
#    ❓ Q: Telegram 沒收到通知？
#    ✅ A: 檢查 TG_TOKEN/CHAT_ID 是否正確，Bot 是否已加入群組
#
#    ❓ Q: 訊號太多/太少？
#    ✅ A: 調整 SCORE_MODE 環境變數或 SETUP_SCORE_THRESHOLD 程式碼
#
# 🎯 專業建議：
# • 預設使用 balanced 模式 (55 分)，勝率/頻率最佳平衡
# • 大資金建議 conservative 模式 (70 分)，寧缺勿濫
# • 監控日誌觀察背離條件命中情況，持續優化策略
# • 定期檢查 whale_optimization.json 的動態閾值調整
