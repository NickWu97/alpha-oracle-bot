name: Alpha Oracle v6.1

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'  # 每 5 分鐘執行一次（監控進場）

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - run: pip install requests pandas numpy
      
      - uses: actions/cache@v3
        with:
          path: pending_signals.json
          key: ${{ runner.os }}-pending-signals
      
      - run: python alpha_oracle_v6.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          COINANK_API_KEY: ${{ secrets.COINANK_API_KEY }}
          MAX_SIGNALS: ${{ vars.MAX_SIGNALS || 5 }}
