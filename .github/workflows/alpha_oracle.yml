name: Alpha Oracle Sniper Bot

on:
  schedule:
    # 每 15 分鐘運行一次
    - cron: '*/15 * * * *'
  workflow_dispatch: # 允許手動點擊執行測試

jobs:
  run_bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必須有寫入權限才能更新 csv 紀錄

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Execute Sniper Bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 如果 CSV 檔案有更新，自動提交回倉庫紀錄
          git add active_trades.csv trade_history.csv daily.ok || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update trade logs [skip ci]"
            git push
          fi
